version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: cricmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cricmind
      POSTGRES_USER: cricmind
      POSTGRES_PASSWORD: cricmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    container_name: cricmind-ai-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cricmind:cricmind@postgres:5432/cricmind
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-claude-sonnet-4-5}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: cricmind-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cricmind
      DB_USER: cricmind
      DB_PASSWORD: cricmind
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-min-32-chars}
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:8080
    container_name: cricmind-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
