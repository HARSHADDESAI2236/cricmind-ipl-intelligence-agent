server:
  port: 8080

spring:
  application:
    name: cricmind-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cricmind}
    username: ${DB_USER:cricmind}
    password: ${DB_PASSWORD:cricmind}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-min-32-chars}
  expiration-ms: 86400000

ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
