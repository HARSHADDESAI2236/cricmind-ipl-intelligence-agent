name: CricMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (Spring Boot) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Run tests
        working-directory: ./backend
        run: mvn -B test

  ai-service-tests:
    name: AI Service (Python) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        working-directory: ./ai-service
        run: pip install -r requirements.txt pytest
      - name: Run tests
        working-directory: ./ai-service
        run: pytest tests/ -v

  frontend-build:
    name: Frontend (React) Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      - name: Build
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, ai-service-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cricmind-backend ./backend
      - name: Build ai-service image
        run: docker build -t cricmind-ai-service ./ai-service
      - name: Build frontend image
        run: docker build -t cricmind-frontend ./frontend
